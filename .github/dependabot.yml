version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
    ignore:
      # FluentAssertions 8.x is published under the Xceed commercial license, which does not fit
      # this MIT-licensed project. Staying on 6.x is a deliberate choice, not neglect.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      # CanKit is the upstream this product is built on; moving to a new version is a decision
      # about compatibility and testing, made by bumping CanKitVersion in eng/Dependencies.props.
      - dependency-name: "CanKit.*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      # Not "build(deps)": .releaserc.json maps build/deps to a patch release, and npm here is
      # only the release tooling itself. A semantic-release bump must not publish nine NuGet
      # packages that contain no change (that is what happened in 1.1.0).
      prefix: "chore(deps)"
    groups:
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: pip
    # eng/docs-requirements.txt: the website build (MkDocs + Material). Not "build(deps)" for the
    # same reason as npm above — a docs-tooling bump must not publish a NuGet release.
    directory: "/eng"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # MkDocs 2.0 removes the plugin and theming systems Material depends on; see the comment in
      # eng/docs-requirements.txt. Minor and patch updates of 1.x are fine.
      - dependency-name: "mkdocs"
        update-types: ["version-update:semver-major"]
