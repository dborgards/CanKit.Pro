version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
    ignore:
      # FluentAssertions 8.x is published under the Xceed commercial license, which does not fit
      # this MIT-licensed project. Staying on 6.x is a deliberate choice, not neglect.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      # CanKit is the upstream this product is built on; moving to a new version is a decision
      # about compatibility and testing, made by bumping CanKitVersion in eng/Dependencies.props.
      - dependency-name: "CanKit.*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      # Not "build(deps)": .releaserc.json maps build/deps to a patch release, and npm here is
      # only the release tooling itself. A semantic-release bump must not publish nine NuGet
      # packages that contain no change (that is what happened in 1.1.0).
      prefix: "chore(deps)"
    groups:
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"
    ignore:
      # 10.x needs conventional-changelog-writer@9+, but semantic-release 25 still resolves
      # writer ^8 through @semantic-release/commit-analyzer and release-notes-generator, so npm
      # installs 8.4.0. Nothing catches the mismatch before a release: the preset still resolves,
      # so PR CI and eng/verify-release-config.mjs both pass. It fails when generateNotes renders
      # a real changelog on main -- "Missing helper: conventional-changelog-writer requires @9 or
      # newer" -- which is how PR #2 broke the release after #15 and had to be reverted (c5bf3ce).
      # Revisit when semantic-release ships a version whose plugins resolve writer@9; the bump
      # then has to happen together with them and be checked with a real
      # `npx semantic-release --dry-run --no-ci`, not just the resolvability check.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
