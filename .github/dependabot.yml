version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      # Not "build(deps)": .releaserc.json maps build/deps to a patch release, and npm here is
      # only the release tooling itself. A semantic-release bump must not publish nine NuGet
      # packages that contain no change (that is what happened in 1.1.0).
      prefix: "chore(deps)"
    groups:
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"
    ignore:
      # 10.x needs conventional-changelog-writer@9+, but semantic-release 25 still resolves
      # writer ^8 through @semantic-release/commit-analyzer and release-notes-generator, so npm
      # installs 8.4.0. The original resolution-only check missed this and PR #2 broke the release
      # after #15, requiring revert c5bf3ce. eng/verify-release-config.mjs now renders real notes
      # to catch the incompatible writer on a PR, without requiring a publication token (#14).
      # Revisit when semantic-release ships a version whose plugins resolve writer@9; the bump
      # then has to happen together with them, migrate presetConfig.types.hidden to effect,
      # pass the rendering guard and be checked with a real semantic-release dry run.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      # The Pages chain has to move together: the deploy job never runs on a pull request, so a
      # separate bump of either half would first be exercised by a real deployment on main.
      github-pages:
        patterns:
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"
          - "actions/configure-pages"
      # init and analyze have to run the same CodeQL Action version: with init on 4.39.0 and
      # analyze on 4.38.2 the analyze post step fails ("Loaded a configuration file for version
      # '4.39.0', but running version '4.38.2'"), so separate bumps of either half (#325, #327)
      # can never pass CI on their own.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: pip
    # eng/docs-requirements.txt: the website build (MkDocs + Material). Not "build(deps)" for the
    # same reason as npm above — a docs-tooling bump must not publish a NuGet release.
    directory: "/eng"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # MkDocs 2.0 removes the plugin and theming systems Material depends on; see the comment in
      # eng/docs-requirements.txt. Minor and patch updates of 1.x are fine.
      - dependency-name: "mkdocs"
        update-types: ["version-update:semver-major"]
      # 0.6.3 declares its MkDocs dependency as `properdocs` and makes pip install a second copy
      # of MkDocs next to the pinned one; see eng/docs-requirements.txt. Lift this when a release
      # of the plugin depends on `mkdocs` again.
      - dependency-name: "mkdocs-literate-nav"
        versions: ["0.6.3"]
