name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion derives the build version from tags and branch history; a shallow clone
          # has neither.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CanKit.Pro.sln

      - name: Build
        run: dotnet build CanKit.Pro.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test CanKit.Pro.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/**
          if-no-files-found: warn

  pack:
    name: pack (dry run)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Proves the release job's `dotnet pack` will work, and that every package still carries a
      # README, a license expression and symbols — before a tag exists to fix it in.
      - name: Pack
        run: dotnet pack CanKit.Pro.sln --configuration Release --output artifacts/nuget

      - name: List produced packages
        run: ls -l artifacts/nuget

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  release-config:
    name: validate release config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install release tooling
        run: npm ci

      # Catches a broken .releaserc.json (typo'd plugin, missing dependency, preset/tooling
      # mismatch) on the pull request that introduces it, rather than on the merge to main that
      # was supposed to publish a release. The full dry run lives in release.yml, where the token
      # has the rights the GitHub plugin needs.
      - name: Verify release configuration loads
        run: node eng/verify-release-config.mjs
