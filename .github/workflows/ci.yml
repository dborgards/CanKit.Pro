name: CI

on:
  push:
    branches: [main]
  pull_request:
  # No `merge_group` trigger. One was carried from #85 until #256 and never fired: the ruleset of
  # this user-owned repository does not offer *Require merge queue* (#165). What stands in for the
  # queue is the ruleset's up-to-date requirement together with CLAUDE.md's
  # one-pull-request-at-a-time rule.
  workflow_dispatch:

concurrency:
  # Only a superseded pull-request run is worth cancelling. On `main` the ref is constant, so a
  # shared group would cancel the first of two quick merges and leave its merge commit with a CI
  # run that never finished -- `git log --first-parent main` would then land on it when asking
  # which commit went red. Every other event therefore gets a group of its own (the run id).
  #
  # The group, not `cancel-in-progress`, carries the distinction: with an expression in
  # `cancel-in-progress`, re-running this pull request's run ended in `startup_failure` (attempt 2
  # of run 39915771444; attempt 1 was an ordinary test failure), where a literal is what every
  # other re-run in the repository has used.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Every job carries `timeout-minutes`: the default is 360, so a hung test would hold a required
  # check for six hours, and the concurrency cancel only helps when a newer push arrives. Limits
  # sit well above observed run times; raise one when a job legitimately outgrows it.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      semver: ${{ steps.pick.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitVersion derives the version from tags and branch history; a shallow clone has
          # neither.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Deliberately allowed to fail. GitVersion cannot version every git shape — a branch with no
      # merge base against a release branch, for one — and "we could not name this build" is not a
      # reason to refuse to compile it.
      - name: Run GitVersion
        id: gitversion
        continue-on-error: true
        run: |
          set -euo pipefail
          dotnet tool restore
          semver=$(dotnet gitversion /showvariable FullSemVer)
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

      - name: Pick the version for this run
        id: pick
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semver }}
        run: |
          semver="$GITVERSION_SEMVER"
          if [ -z "$semver" ]; then
            semver="0.0.0-unversioned.$GITHUB_RUN_NUMBER"
            echo "::warning title=GitVersion::Could not derive a version for this ref; building as $semver. Release versions come from semantic-release and are unaffected."
          fi
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "Building as $semver"

  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: version
    # The macOS leg is the slowest and most variable runner (and the one #92 is about).
    timeout-minutes: 30
    env:
      # Passed through the environment, not pasted into the scripts with `${{ }}`: the value is
      # derived from the branch name of a pull request. The steps that use it say `shell: bash`
      # because the Windows leg would otherwise run PowerShell, where this is `$env:SEMVER`.
      SEMVER: ${{ needs.version.outputs.semver }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CanKit.Pro.sln

      - name: Build
        shell: bash
        run: dotnet build CanKit.Pro.sln --configuration Release --no-restore "-p:Version=$SEMVER"

      # Split per target framework rather than one solution-wide run, for two reasons that only
      # appeared once the net48 leg existed:
      #
      #   * both legs wrote the same LogFileName, so the second silently overwrote the first --
      #     the uploaded Windows test-results artifact held net48 only;
      #   * coverlet.collector 10.x ships no .NET Framework assets, so it is referenced for
      #     net10.0 only (see tests/Directory.Build.props). Passing --collect to a solution-wide
      #     run asked the net48 leg for a collector that cannot be there, and VSTest reported
      #     "Unable to find a datacollector with friendly name 'XPlat Code Coverage'" on every
      #     Windows run. Coverage was never actually lost; the message was noise, but noise that
      #     reads like a broken build.
      #
      # TestTfmsInParallel is already false, so this changes ordering not at all -- the legs ran
      # back to back before and still do.
      - name: Test (net10.0)
        shell: bash
        run: >
          dotnet test CanKit.Pro.sln
          --configuration Release
          --no-build
          --framework net10.0
          "-p:Version=$SEMVER"
          --logger "trx;LogFileName=test-results-net10.0.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      # Windows only: net48 is where the netstandard2.0 assets actually execute. No --collect,
      # for the reason above.
      - name: Test (net48)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          dotnet test CanKit.Pro.sln
          --configuration Release
          --no-build
          --framework net48
          "-p:Version=$SEMVER"
          --logger "trx;LogFileName=test-results-net48.trx"
          --results-directory artifacts/test-results

      # An approval test that has no baseline yet writes what it saw; printing it means the
      # baseline can be reviewed and committed straight from the log, without downloading an
      # artifact first.
      - name: Show generated API approvals
        if: failure() && runner.os == 'Linux'
        run: |
          shopt -s nullglob
          for f in tests/CanKit.Pro.Tests/ApiApprovals/*.received.txt; do
            echo "----- BEGIN $f"
            cat "$f"
            echo "----- END $f"
          done

      # Coverage was collected and then never looked at: the cobertura files rode along inside the
      # test-results artifact, so the number existed but reading it meant downloading a zip. This
      # puts it on the run's summary page. Linux only -- all three legs measure the same net10.0
      # code, and three identical tables would be noise.
      - name: Coverage summary
        if: always() && runner.os == 'Linux'
        run: python3 eng/coverage-summary.py artifacts/test-results >> "$GITHUB_STEP_SUMMARY"

      # Linux only, for the same reason as the summary above: all three legs measure the same
      # net10.0 code, so three uploads would be three copies of one number.
      #
      # `fail_ci_if_error: false` on purpose. Codecov being unreachable, or a fork pull request
      # having no access to the token, must not turn a green build red — the coverage number is
      # here to be watched, and .github/codecov.yml keeps its checks informational to match.
      - name: Upload coverage to Codecov
        if: always() && runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # coverlet writes to artifacts/test-results/<guid>/coverage.cobertura.xml, so point the
          # search at the parent and let it find the file rather than naming a path with a guid
          # in it. `files` is not set: it takes explicit paths, and combining the two is
          # contradictory.
          directory: artifacts/test-results
          flags: net10.0
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/**
            tests/CanKit.Pro.Tests/ApiApprovals/*.received.txt
          if-no-files-found: warn

  pack:
    name: pack (dry run)
    runs-on: ubuntu-latest
    needs: [version, build-test]
    timeout-minutes: 20
    env:
      SEMVER: ${{ needs.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Proves the packing the release workflow's `verify` job will do still works, on every pull
      # request rather than only when someone cuts a release.
      - name: Pack
        run: dotnet pack CanKit.Pro.sln --configuration Release "-p:Version=$SEMVER" --output artifacts/nuget

      - name: List produced packages
        run: ls -l artifacts/nuget

      # The claim this job used to make in a comment, now actually checked: every package carries
      # a README, a license expression and a .snupkg, and there are as many of them as expected.
      #
      # The release workflow runs this same script again as `prepareCmd`, there with the version
      # about to be tagged. Both run before the tag exists, so neither is the last line of defence
      # — this one is simply the early one, on the pull request that would introduce the problem.
      - name: Verify package contents
        run: python3 eng/verify-packages.py artifacts/nuget

      # The release's SBOM step, run on every pull request for the same reason the pack is: a
      # change that breaks it -- a dependency whose licence the tool cannot map to SPDX, a tool
      # bump that changes the output -- should fail here, not on the release that was supposed to
      # carry the SBOMs. The version is GitVersion's, minus the `+build` metadata that NuGet
      # leaves out of a package file name.
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          version="$SEMVER"
          python3 eng/generate-sboms.py artifacts/nuget "${version%%+*}" artifacts/sbom

      - name: Verify SBOMs
        run: |
          version="$SEMVER"
          python3 eng/verify-sboms.py artifacts/sbom artifacts/nuget "${version%%+*}"

      # The checks' own tests (eng/test_*.py), standard library only. They live in this job
      # because it is the one that runs the scripts they cover.
      #
      # That includes eng/test_verify_ruleset.py, which compares the required checks of the
      # exported `main` ruleset (.github/rulesets/main.json) with the job names in this file: a
      # renamed job fails here, on the pull request that renames it, rather than leaving a
      # required check that never reports.
      - name: Test the verification scripts
        run: python3 -m unittest discover -s eng -p "test_*.py"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error

  release-config:
    name: validate release config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install release tooling
        run: npm ci --ignore-scripts

      # Catches a broken .releaserc.json (typo'd plugin, missing dependency, preset/tooling
      # mismatch) on the pull request that introduces it, rather than on the merge to main that
      # was supposed to publish a release. The full dry run lives in release.yml, where the token
      # has the rights the GitHub plugin needs.
      - name: Verify release configuration loads
        run: node eng/verify-release-config.mjs

  traceability:
    name: requirements traceability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SRS §7 rule -- every `Must` requirement covered by a test before its layer counts
      # as finished -- was unenforced until this check existed, so nobody could say how many
      # met it. The answer turned out to be eleven short, and not one of the eleven was in the
      # issue tracker. The check is a ratchet, not a gate: it passes on the recorded gaps and
      # fails on a new one, or on a recorded one that has since been closed and not removed.
      #
      # It gates through the `main` ruleset, where it is a required check since #256 -- a
      # repository setting, not something this file can declare. Until then only the OS legs and
      # `format` were required, so a pull request could introduce a new untraced `Must`, leave
      # this job red, and still satisfy every required check (Codex on #126).
      #
      # Deliberately not wired as a `needs:` of a build leg, which would have enforced it without
      # the ruleset: that is the coupling the `format` comment below rejects for the same reason
      # -- a requirement with no test has no business stopping the build legs from running.
      - name: Verify requirements traceability
        run: python3 eng/verify-requirements-traceability.py

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # `dotnet format` was never run in CI, so import ordering and whitespace drifted on `main`
      # until three separate agents tripped over the same three files. The formatter's own rules
      # are the arbiter here; nothing in .editorconfig was changed to accommodate the fixes.
      #
      # Deliberately its own job rather than a step in build-test: a misplaced blank line has no
      # business failing the build legs.
      #
      # It gates all the same. Code style is enforced here and only here --
      # EnforceCodeStyleInBuild was considered and rejected, because two mechanisms for one rule
      # eventually disagree. That makes this job the single arbiter, so it is one of the required
      # checks of the `main` ruleset (a repository setting, not something this file can declare).
      - name: Verify formatting
        run: dotnet format CanKit.Pro.sln --verify-no-changes --verbosity diagnostic

  commit-subjects:
    name: commit subjects
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The pull request's own head, not the synthetic merge commit GitHub checks out by default:
      # `origin/<base>..HEAD` is then exactly the branch's commits. Full history, so that
      # `origin/<base>` exists to compare with and to take the checker from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # semantic-release analyses every commit on the branch (CLAUDE.md, CONTRIBUTING.md), and
      # silently skips a subject that is not a Conventional Commit -- a `fix` written as "Fix the
      # thing" publishes nothing. Merge commits are skipped (see the script).
      #
      # Deliberately NOT a required check of the `main` ruleset, and not listed in
      # .github/rulesets/main.json: it reports, the maintainer decides. It only runs on pull
      # requests, so it is absent -- not red -- on `main`.
      #
      # The checker is the base branch's copy, not the head's: a pull request does not get to
      # change the rule it is judged by, and a branch cut before the checker existed has no
      # eng/check-commit-subjects.py to run (every such branch failed with exit 2 here, whatever
      # its subjects). Only the script moves to the runner's temp directory; the working
      # directory stays the checkout, whose `origin/<base>..HEAD` is the range checked. A base
      # that has no checker yet (a pull request stacked on an older branch) has nothing to judge
      # by, so the step says so and passes.
      - name: Check commit subjects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          checker="$RUNNER_TEMP/check-commit-subjects.py"
          if ! git cat-file -e "origin/${BASE_REF}:eng/check-commit-subjects.py" 2>/dev/null; then
            echo "::notice::origin/${BASE_REF} has no eng/check-commit-subjects.py; nothing to check against."
            exit 0
          fi
          git show "origin/${BASE_REF}:eng/check-commit-subjects.py" > "$checker"
          python3 -I "$checker" "$BASE_REF"
