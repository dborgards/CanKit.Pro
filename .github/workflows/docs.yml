name: Docs

# Builds the project website (mkdocs.yml) and publishes it to GitHub Pages.
#
# Deploys through the Pages artifact API rather than a gh-pages branch: no second writer on the
# repository next to semantic-release, and nothing for branch protection to argue with. The
# repository's Pages source must be set to "GitHub Actions" once (Settings → Pages).
#
# Pull requests only build (strict mode, so a broken link fails the check); pushes to main deploy.
#
# A release is a third trigger: semantic-release commits the changelog to main with "[skip ci]",
# which suppresses every push-triggered workflow including this one, so the site's changelog page
# would otherwise lag until the next unrelated docs change. Listening for the Release workflow's
# completion rebuilds right after each release instead.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      # The API reference is generated from the XML doc comments, so the code is a docs source.
      - "src/**"
      - "CanKit.Pro.sln"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "eng/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "src/**"
      - "CanKit.Pro.sln"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "eng/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; queued runs are not cancelled so every push to main lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    # After a Release run, rebuild only if it succeeded; a failed release has no new changelog.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: eng/docs-requirements.txt

      - name: Install MkDocs
        run: pip install -r eng/docs-requirements.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Compiles the solution and turns the XML documentation comments into docs/api/. Must run
      # before mkdocs: the API tab's pages and its navigation file do not exist until it has.
      - name: Generate the API reference
        run: eng/build-api-docs.sh

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
