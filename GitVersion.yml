# yaml-language-server: $schema=https://raw.githubusercontent.com/GitTools/GitVersion/main/schemas/6.0/GitVersion.configuration.json
#
# GitVersion answers "what version is *this* commit?" for every build that is not a release: CI
# artifacts, pull-request builds and local `dotnet pack` runs all get a real, ordered SemVer
# instead of 0.0.0. It never decides what the next release is — semantic-release does that from
# the conventional commits and writes the `vX.Y.Z` tag, which GitVersion then reads back.
#
# During a release build `Directory.Build.props` disables GitVersion entirely, because
# semantic-release passes the authoritative version via -p:Version=X.Y.Z.
#
# Trunk-based: `main` is the only long-lived branch (see CONTRIBUTING.md), so the GitHubFlow
# preset fits; everything not matched below falls through to its catch-all branch configuration.
workflow: GitHubFlow/v1

mode: ContinuousDelivery
tag-prefix: '[vV]?'

# The floor GitVersion starts from while no `vX.Y.Z` tag exists yet. Without it, a repository
# whose history contains neither a tag nor a merge base with `main` — a brand-new repository, or
# a freshly branched fork — gives GitVersion nothing to count from and it fails the build with
# "No base versions determined on the current branch". Once the first tag exists it outranks this
# value and this line becomes inert; it is not a way to steer releases, which semantic-release
# decides from the commits.
next-version: 0.1.0

# The GitHubFlow preset's strategies, plus `Fallback`. Without Fallback, a branch GitVersion
# classifies as orphaned — one with no merge base against a release branch, which is exactly what
# every branch in a repository is before `main` exists — yields no base version at all and
# GitVersion aborts the build with "No base versions determined on the current branch". Fallback
# supplies 0.0.0 from the repository's first commit in that case; it never wins over a real tag.
strategies:
  - ConfiguredNextVersion
  - MergeMessage
  - TaggedCommit
  - TrackReleaseBranches
  - VersionInBranchName
  - Fallback

# AssemblyVersion stays at major.minor.patch so a patch release does not force a binding redirect
# on .NET Framework consumers. The exact build lands in FileVersion / InformationalVersion, which
# is where a diagnostic tool looks anyway.
assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch

branches:
  main:
    label: ''
    increment: Patch
  pull-request:
    label: pr
